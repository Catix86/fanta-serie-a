<section class="section-header">
  <div class="section-header-main">
    <button
      type="button"
      class="section-header-icon"
      [class.clickable]="iconClickable()"
      [disabled]="!iconClickable()"
      [attr.aria-label]="iconClickable() ? iconLabel() || 'Apri' : null"
      (click)="onIconClick()"
    >
      @if (iconSrc()) {
        <img
          class="section-header-custom-icon"
          [src]="iconSrc()"
          alt=""
          aria-hidden="true"
        />
      } @else {
        <span class="material-symbols-rounded">
          {{ icon() }}
        </span>
      }
    </button>

    <div class="section-header-copy">
      <h1>
        {{ title() }}
      </h1>

      @if (subtitle()) {
        <p>
          {{ subtitle() }}
        </p>
      }
    </div>
  </div>

  @if (actions().length > 0) {
    <div class="section-header-actions">
      @for (action of actions(); track action.id) {
        <button
          type="button"
          class="section-header-action"
          [attr.aria-label]="action.label"
          (click)="onActionClick(action.id)"
        >
          <span class="material-symbols-rounded">
            {{ action.icon }}
          </span>
        </button>
      }
    </div>
  }
</section>
